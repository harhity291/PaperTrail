<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="PaperTrail logo">
  <defs>
    <linearGradient id="pt-page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f9d27c"/>
      <stop offset="1" stop-color="#e09a2c"/>
    </linearGradient>
  </defs>
  <!-- the paper, with a folded corner -->
  <path d="M12 4H28L38 14V40A4 4 0 0 1 34 44H12A4 4 0 0 1 8 40V8A4 4 0 0 1 12 4Z" fill="url(#pt-page)"/>
  <path d="M28 4V10A4 4 0 0 0 32 14H38Z" fill="#fde9bd"/>
  <!-- the trail across the paper -->
  <path d="M13 39C21 39 32 38.5 32 34S23 31 23 28" fill="none" stroke="#1b1305" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="0 3.9"/>
  <!-- the pin: the answer at the end of the trail -->
